name: baseeto
description: BAseeto - Blue Archive style chat simulator & story editor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  http: ^1.2.0
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.7
  gal: ^2.3.0
  permission_handler: ^11.3.0
  photo_view: ^0.14.0
  file_picker: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.19.0
  audioplayers: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/characters/
